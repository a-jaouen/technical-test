# busybox httpd MIME types for the Vite build output
# (browsers refuse ES module scripts served with a wrong MIME type)
.html:text/html; charset=utf-8
.js:text/javascript
.mjs:text/javascript
.css:text/css
.json:application/json
.svg:image/svg+xml
.png:image/png
.webp:image/webp
.ico:image/x-icon
.woff2:font/woff2
